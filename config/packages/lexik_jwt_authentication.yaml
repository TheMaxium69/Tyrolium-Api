lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600 # 1h — explicite plutôt que de reposer sur le défaut du bundle
    encoder:
        signature_algorithm: RS256 # asymétrique : d'autres services peuvent vérifier avec juste la clé publique
