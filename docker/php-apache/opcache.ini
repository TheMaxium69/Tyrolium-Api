opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
; validate_timestamps=1 même en "prod" locale : le code est bind-mounté depuis
; l'hôte (voir compose.yaml), donc on veut que les changements soient pris en
; compte sans reconstruire l'image. Un vrai déploiement prod (image immuable)
; passerait ça à 0 — hors scope ici, voir le commentaire en tête du Dockerfile.
opcache.validate_timestamps=1
