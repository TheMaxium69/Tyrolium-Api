<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted

        # Symfony : toute URL qui ne correspond pas à un fichier réel de public/
        # (assets...) retombe sur le front controller.
        FallbackResource /index.php

        # Sans ça, Apache ne transmet jamais le header Authorization à PHP
        # ($_SERVER['HTTP_AUTHORIZATION'] reste vide) — cassait toute route
        # protégée par JWT (lexik renvoie "JWT Token not found" même avec un
        # Bearer valide). Vérifié en réel le 25/09/2026.
        CGIPassAuth On
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
